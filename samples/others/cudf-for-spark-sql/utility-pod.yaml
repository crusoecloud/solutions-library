---
apiVersion: v1
kind: Pod
metadata:
  name: utility-pod
spec:
  volumes:
    - name: spark-logs
      persistentVolumeClaim:
        claimName: spark-logs
    - name: data
      persistentVolumeClaim:
        claimName: data-disk
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: DoesNotExist
  containers:
    - name: utility
      image: "<your image tag here>"
      command: ["/bin/sleep", "infinity"]
      volumeMounts:
        - mountPath: "/mnt/spark-logs"
          name: spark-logs
        - mountPath: "/data"
          name: data
