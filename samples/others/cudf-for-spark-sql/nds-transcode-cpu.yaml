apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: nds-transcode-cpu
spec:
  type: Python
  mode: cluster
  # Update image with your own registry/tag
  image: "ghcr.io/datadoc24/spark-4-cudf:v12"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/spark-benchmarks/nds/nds_transcode.py"
  arguments:
    - "/data/tpcds-sf3000"         # input_prefix (CSV data from nds_gen_data.py)
    - "/data/tpcds-sf3000-parquet" # output_prefix
    - "/data/transcode-report.txt" # report_file
    - "--input_format"
    - "csv"
    - "--output_format"
    - "parquet"
    - "--output_mode"
    - "overwrite"
    - "--app_name"
    - "NDS CPU-only Transcode"
  sparkVersion: "4.2.0"
  restartPolicy:
    type: Never
  volumes:
    - name: data-volume
      persistentVolumeClaim:
        claimName: data-disk
    - name: spark-logs
      persistentVolumeClaim:
        claimName: spark-logs-pvc
    - name: spark-local-dir-scratch
      hostPath:
        path: /mnt/raid0
        type: Directory
  driver:
    cores: 16
    memory: "32768m"
    serviceAccount: spark-operator-spark
    volumeMounts:
      - name: data-volume
        mountPath: "/data"
      - name: spark-logs
        mountPath: /mnt/spark-logs
      - name: spark-local-dir-scratch
        mountPath: /tmp/spark-local
  executor:
    cores: 64
    # we can have 2 large pods per gpu node each with a lot of cores and memory
    # but no GPU for this example
    instances: 16
    memory: "300g"
    memoryOverhead: "24576"
    volumeMounts:
      - name: data-volume
        mountPath: "/data"
      - name: spark-logs
        mountPath: /mnt/spark-logs
      - name: spark-local-dir-scratch
        mountPath: /tmp/spark-local
  sparkConf:
    # Local storage on NVMe RAID
    "spark.local.dir": "/tmp/spark-local"
    # SQL / compatibility
    "spark.sql.shuffle.partitions": "2000"
    "spark.sql.files.maxPartitionBytes": "512m"
    "spark.sql.legacy.parquet.datetimeRebaseModeInWrite": "CORRECTED"
    "spark.sql.legacy.charVarcharAsString": "true"
    # Event logging
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "file:///mnt/spark-logs"
    "spark.eventLog.compress": "true"
