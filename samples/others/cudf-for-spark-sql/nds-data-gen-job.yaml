apiVersion: batch/v1
kind: Job
metadata:
  name: nds-data-generation
spec:
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: "data-disk"
      containers:
        - name: nds-data-gen
          image: "<your image tag here>"
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /opt/spark-benchmarks/nds/nds_gen_data.py
            - "local"
            - "1000" #1 TB of synthentic data, to start with
            - "100"
            - "/data/tpcds-sf1000"
            - "--overwrite_output"
          volumeMounts:
            - name: data-volume
              mountPath: "/data"
