---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-disk
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: crusoe-csi-driver-fs-sc 
  resources:
    requests:
      storage: 50Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-logs
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: crusoe-csi-driver-fs-sc 
  resources:
    requests:
      storage: 1Ti
