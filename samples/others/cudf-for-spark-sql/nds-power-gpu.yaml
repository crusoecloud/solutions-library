apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: nds-power-gpu
spec:
  type: Python
  mode: cluster
  image: "<your image tag here>"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/spark-benchmarks/nds/nds_power.py"
  arguments:
    - "/data/tpcds-sf1000-parquet" # input_prefix
    - "/data/query_streams/query_1.sql"
    - "/data/mytime.csv" # report_file
  sparkVersion: "4.2.0"
  restartPolicy:
    type: Never
  volumes:
    - name: data-volume
      persistentVolumeClaim:
        claimName: data-disk
    - name: spark-logs
      persistentVolumeClaim:
        claimName: spark-logs-pvc
    - name: spark-local-dir-scratch
      hostPath:
        path: /mnt/raid0/spark-local
        type: DirectoryOrCreate
  driver:
    cores: 8
    memory: "32768m"
    serviceAccount: spark-operator-spark
    initContainers:
      - name: set-dir-permissions
        image: busybox
        command: ["chmod", "777", "/mnt/raid0/spark-local"]
        volumeMounts:
          - name: spark-local-dir-scratch
            mountPath: /mnt/raid0/spark-local
        securityContext:
          runAsUser: 0
    volumeMounts:
      - name: data-volume
        mountPath: "/data"
      - name: spark-logs
        mountPath: /mnt/spark-logs
      - name: spark-local-dir-scratch
        mountPath: /tmp/spark-local
  executor:
    cores: 16
    instances: 16  # 1 per H100 GPU (8 per node × 2 nodes)
    memory: "64000m"
    memoryOverhead: "32768"  # 32 GB off-heap: pinned pool + UCX buffers
    gpu:
      name: "nvidia.com/gpu"
      quantity: 1
    initContainers:
      - name: set-dir-permissions
        image: busybox
        command: ["chmod", "777", "/mnt/raid0/spark-local"]
        volumeMounts:
          - name: spark-local-dir-scratch
            mountPath: /mnt/raid0/spark-local
        securityContext:
          runAsUser: 0
    volumeMounts:
      - name: data-volume
        mountPath: "/data"
      - name: spark-logs
        mountPath: /mnt/spark-logs
      - name: spark-local-dir-scratch
        mountPath: /tmp/spark-local
  sparkConf:
    # RAPIDS GPU plugin
    "spark.plugins": "com.nvidia.spark.SQLPlugin"
    "spark.executor.resource.gpu.amount": "1"
    "spark.executor.resource.gpu.vendor": "nvidia.com"
    "spark.executor.resource.gpu.discoveryScript": "/opt/spark/bin/getGpusResources.sh"
    "spark.rapids.shuffle.enabled": "true"
    "spark.shuffle.manager": "com.nvidia.spark.rapids.spark420.RapidsShuffleManager"
    "spark.rapids.shuffle.transport.enabled": "true"
    # Allow multiple concurrent GPU tasks per executor (1/4 = 4 tasks per GPU, 20 GB HBM3 each)
    # Fewer, larger tasks avoids GPU memory pressure on large SF3001 joins/aggregations
    "spark.task.resource.gpu.amount": "0.25"
    "spark.rapids.sql.concurrentGpuTasks": "4"
    # Memory
    "spark.local.dir": "/tmp/spark-local"
    "spark.rapids.memory.pinnedPool.size": "24g"  # 24 GB pinned pool for H100 bandwidth
    # SQL / compatibility
    "spark.sql.shuffle.partitions": "2000"
    "spark.sql.files.maxPartitionBytes": "1g"  # larger partitions to fill H100 GPU memory
    "spark.sql.legacy.parquet.datetimeRebaseModeInWrite": "CORRECTED"
    "spark.sql.legacy.charVarcharAsString": "true"
    "spark.rapids.sql.incompatibleOps.enabled": "true"
    "spark.rapids.sql.variableFloatAgg.enabled": "true"
    "spark.rapids.sql.csv.read.decimal.enabled": "true"
    # AQE: coalesces small shuffle partitions dynamically, helps many TPC-DS queries
    "spark.sql.adaptive.enabled": "true"
    "spark.kubernetes.executor.deleteOnTermination": "true"
    # Event logging
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "file:///mnt/spark-logs"
    "spark.eventLog.compress": "true"
