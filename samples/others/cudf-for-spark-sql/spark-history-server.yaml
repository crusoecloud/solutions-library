---
# 1. PVC for Spark event logs (shared between History Server and Spark apps)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-logs-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: crusoe-csi-driver-fs-sc
  resources:
    requests:
      storage: 1Ti

---
# 2. Spark History Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: default
  labels:
    app: spark-history-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      containers:
        - name: spark-history-server
          # Use the same image as your Spark apps so versions are aligned
          image: "<your image tag here>"
          imagePullPolicy: IfNotPresent
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.history.HistoryServer
          env:
            - name: SPARK_DAEMON_MEMORY
              value: "6g"
            - name: SPARK_HISTORY_OPTS
              value: >-
                -Dspark.history.fs.logDirectory=file:///mnt/spark-logs
                -Dspark.history.ui.port=18080
                -Dspark.history.retainedApplications=100
                -Dspark.history.fs.cleaner.enabled=true
                -Dspark.history.fs.cleaner.interval=1d
                -Dspark.history.fs.cleaner.maxAge=7d
          ports:
            - name: ui
              containerPort: 18080
              protocol: TCP
          volumeMounts:
            - name: spark-logs
              mountPath: /mnt/spark-logs
          resources:
            requests:
              cpu: "4"
              memory: "4Gi"
            limits:
              cpu: "8"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: spark-logs
          persistentVolumeClaim:
            claimName: spark-logs-pvc
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: DoesNotExist
---
# 3. LoadBalancer Service for the History Server UI
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  namespace: default
  labels:
    app: spark-history-server
spec:
  type: LoadBalancer
  selector:
    app: spark-history-server
  ports:
    - name: ui
      port: 18080
      targetPort: 18080
      protocol: TCP
