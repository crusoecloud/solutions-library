- name: Create /opt/hpcx directory
  ansible.builtin.file:
    path: /opt/hpcx
    state: directory
    mode: '755'

- name: Download HPCX archive
  vars:
    distribution_with_version: "{{ (ansible_facts['distribution'] | lower) + ansible_facts['distribution_version'] }}"
  ansible.builtin.get_url:
    url: https://content.mellanox.com/hpc/hpc-x/{{ hpcx_version }}_{{ cuda_version }}/hpcx-{{ hpcx_version }}-gcc-{{ ofed_distro }}-{{ distribution_with_version }}-{{ cuda_version }}-{{ ansible_facts['architecture'] }}.tbz
    dest: /opt/hpcx.tbz
    mode: '755'

- name: Extract HPCX archive
  ansible.builtin.command: tar -xf /opt/hpcx.tbz --directory /opt/hpcx --strip-components 1

- name: Remove HPCX archive
  ansible.builtin.file:
    path: /opt/hpcx.tbz
    state: absent

- name: Remove the existing ompi installation.
  ansible.builtin.file:
    path: /opt/hpcx/ompi/
    state: absent

- name: Rebuild ompi
  ansible.builtin.command:
    cmd: |
      /opt/hpcx/utils/hpcx_rebuild.sh 
      --cuda 
      --ompi-extra-config "
        --with-platform=contrib/platform/mellanox/optimized
        --with-slurm
        --with-pmix=/opt/pmix
        --with-libevent=/usr
        --with-hwloc=/usr
      "
  environment:
    CUDA_HOME: "/usr/local/cuda"
    ompi_prefix: "/opt/hpcx/ompi"
