{{- if .Values.mariadb.enabled }}
{{- $secretName := include "slurm-accounting.mariadb.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName }}
{{- $rootPassword := .Values.mariadb.rootPassword }}
{{- if not $rootPassword }}
  {{- if $existing }}
    {{- $rootPassword = index $existing.data "root-password" | b64dec }}
  {{- else }}
    {{- $rootPassword = randAlphaNum 32 }}
  {{- end }}
{{- end }}
{{- $password := .Values.mariadb.password }}
{{- if not $password }}
  {{- if $existing }}
    {{- $password = index $existing.data "password" | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "slurm-accounting.labels" . | nindent 4 }}
type: Opaque
data:
  root-password: {{ $rootPassword | b64enc }}
  password: {{ $password | b64enc }}
{{- end }}
