# EXAMPLE ONLY — do NOT commit a real Secret. The orchestrator builds this
# in-cluster from your .env (the credential never touches the repo or your
# shell history). This shows the shape if you want to create it by hand.
#
# The single key `rclone.conf` is mounted read-only at /config/rclone.conf.
#
# Build it safely from a local rclone.conf without echoing creds into argv:
#   kubectl create secret generic cmk-data-transfer-s3 \
#       --from-file=rclone.conf=./rclone.conf \
#       --dry-run=client -o yaml | kubectl apply -f -
#
# ...where ./rclone.conf (git-ignored) contains:
#   [src]
#   type = s3
#   provider = Other
#   access_key_id = <SRC_S3_ACCESS_KEY_ID>
#   secret_access_key = <SRC_S3_SECRET_ACCESS_KEY>
#   endpoint = https://s3.<region>.amazonaws.com
#   region = <REGION>
#   force_path_style = true
#   no_check_bucket = true
#
#   # (only when DEST_TYPE=s3)
#   [dest]
#   type = s3
#   provider = Other
#   access_key_id = <DEST_S3_ACCESS_KEY_ID>
#   secret_access_key = <DEST_S3_SECRET_ACCESS_KEY>
#   endpoint = https://s3.crusoe.ai
#   region = <REGION>
#   force_path_style = true
#   no_check_bucket = true
apiVersion: v1
kind: Secret
metadata:
  name: cmk-data-transfer-s3
type: Opaque
stringData:
  rclone.conf: |
    [src]
    type = s3
    provider = Other
    access_key_id = REDACTED
    secret_access_key = REDACTED
    endpoint = https://s3.us-east-1.amazonaws.com
    region = us-east-1
    force_path_style = true
    no_check_bucket = true
