# Reka Flash 3-sized (21B) training on 2-node H100 — POC validation
#
# Custom 21B Llama-3-shaped dense transformer (dim=6144, n_layers=40,
# n_heads=48, n_kv_heads=8, GQA ratio 6:1, ~20.9B params reported by torchtitan).
# Fits between the built-in 8B and 70B flavors — useful for POCs where 8B is
# too small to stress the cluster and 70B is too big to fit on 2 nodes.
#
# torchtitan release-v0.2.2's llama3 registry only ships 8B/70B/405B, so we
# runtime-patch a new "21B" entry into torchtitan/models/llama3/__init__.py
# at container start. The patch script (patch_21b.py) is mounted from this
# ConfigMap. No custom image rebuild is required.
#
# Cluster fit on 2× h100-80gb-sxm-ib (16 GPUs total):
#   - TP=2 × FSDP=8 mesh (TP intra-node NVLink, FSDP across the 2 nodes over IB)
#   - batch=2, seq=8192, mode="selective", compile=OFF
#   - torch.compile is DISABLED because the fused RMSNorm kernel at dim=6144
#     exceeds H100's per-SM shared memory (~232 KB); compile works fine for
#     the 8B flavor (dim=4096) but not 21B.
#   - TP=1 with compile=off OOMs at ~98% memory in the loss cross_entropy;
#     TP=2 halves per-GPU activation memory and comfortably fits.
#
# Tokenizer: reuses the Llama 3.1 tokenizer at
# /workspace/torchtitan/assets/hf/Llama-3.1-8B (shared across all Llama 3.1 sizes).
#
# Fix applied: checkpoint=false and profiling=false (emptyDir-backed async
# checkpoint dumps at step 500 crashed larger runs in a separate incident).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: torchtitan-llama3-21b-config
data:
  patch_21b.py: |
    """Runtime-patch torchtitan to add a "21B" Llama-3-shaped flavor."""
    import sys, os, shutil
    path = "/workspace/torchtitan/torchtitan/models/llama3/__init__.py"
    with open(path) as f:
        src = f.read()
    if '"21B"' in src:
        print("21B flavor already present, no patch needed", flush=True)
        sys.exit(0)
    entry = (
        '    "21B": TransformerModelArgs(\n'
        '        dim=6144,\n'
        '        n_layers=40,\n'
        '        n_heads=48,\n'
        '        n_kv_heads=8,\n'
        '        ffn_dim_multiplier=1.3,\n'
        '        multiple_of=1024,\n'
        '        rope_theta=500000,\n'
        '    ),\n'
    )
    marker = '    "8B": TransformerModelArgs'
    if marker not in src:
        print("ERROR: 8B marker not found; layout of __init__.py changed?", file=sys.stderr, flush=True)
        sys.exit(1)
    src = src.replace(marker, entry + marker, 1)
    with open(path, "w") as f:
        f.write(src)
    cache = "/workspace/torchtitan/torchtitan/models/llama3/__pycache__"
    if os.path.exists(cache):
        shutil.rmtree(cache)
    from torchtitan.models.llama3 import llama3_args
    assert "21B" in llama3_args, f"Patch failed; keys: {list(llama3_args.keys())}"
    print("Patched: 21B flavor added, dict keys:", list(llama3_args.keys()), flush=True)
  llama3_21B.toml: |
    [job]
    dump_folder = "/outputs"
    description = "Llama 3.1-shaped 21B (Reka Flash 3-sized) training on Crusoe H100"

    [profiling]
    enable_profiling = false
    save_traces_folder = "/outputs/profile_trace"
    profile_freq = 100

    [metrics]
    log_freq = 10
    enable_tensorboard = true
    save_tb_folder = "/outputs/tb"

    [model]
    name = "llama3"
    flavor = "21B"
    # Tokenizer assets are built into the Docker image.
    hf_assets_path = "/workspace/torchtitan/assets/hf/Llama-3.1-8B"

    [optimizer]
    name = "AdamW"
    lr = 3e-4
    eps = 1e-8

    [lr_scheduler]
    warmup_steps = 200

    [training]
    local_batch_size = 2
    seq_len = 8192
    max_norm = 1.0
    steps = 1000
    dataset = "c4"

    [parallelism]
    data_parallel_replicate_degree = 1
    # -1 means shard across all 16 GPUs (16-way FSDP across both nodes).
    data_parallel_shard_degree = -1
    tensor_parallel_degree = 2
    pipeline_parallel_degree = 1
    context_parallel_degree = 1

    [checkpoint]
    enable = false
    folder = "/outputs/checkpoint"
    interval = 500
    last_save_model_only = true
    export_dtype = "float32"
    # Change async_mode to "disabled" if async checkpointing causes OOM crashes
    async_mode = "async"

    [compile]
    enable = false
    components = ["model", "loss"]

    # H100 80GB has less HBM headroom than H200 141GB. With batch=2 + torch.compile
    # active, raw activations + compile-graph overhead push past 80GB at scale.
    # Selective AC drops re-computable activations to save ~25 GB per GPU at
    # the cost of ~5 percentage points of MFU. Required on H100 at this scale.
    [activation_checkpoint]
    mode = "selective"
    selective_ac_option = "op"

    [quantize.linear.float8]
    enable_fsdp_float8_all_gather = false
    precompute_float8_dynamic_scale_for_fsdp = false
    filter_fqns = ["output"]

---
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: torchtitan-llama3-21b-streaming
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
          - name: pytorch
            image: ghcr.io/datadoc24/torchtitan-llama3-8b:latest
            imagePullPolicy: IfNotPresent
            securityContext:
              capabilities:
                add: ["IPC_LOCK"]
            workingDir: /workspace/torchtitan
            command:
            - /bin/bash
            - -c
            - |
              python3 /workspace/patch_21b.py
              torchrun \
                --nproc_per_node=8 \
                --nnodes=2 \
                --node_rank=${RANK} \
                --rdzv_endpoint=${MASTER_ADDR}:${MASTER_PORT} \
                --rdzv_backend=c10d \
                --rdzv_conf=timeout=1800 \
                -m torchtitan.train \
                --job.config_file /config/llama3_21B.toml
            env:
            - name: PYTORCH_ALLOC_CONF
              value: "expandable_segments:True"
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_IB_DISABLE
              value: "0"
            # H200: exclude mlx5_0 (admin/IPoIB), use the 8 remaining IB HCAs
            - name: NCCL_IB_HCA
              value: "^mlx5_0"
            # Aligned with Crusoe's known-working Slurm script (2 MB ring buffer)
            - name: NCCL_BUFFSIZE
              value: "2097152"
            # NOTE: NCCL_IB_GID_INDEX and NCCL_NET_GDR_LEVEL deliberately omitted —
            # the GID_INDEX=3 default in the template is for RoCE v2, not native IB.
            # The proven Crusoe Slurm config sets neither; we follow that.
            # HF token only needed for streaming-data variant (downloads c4 from Hugging Face).
            - name: HF_TOKEN
              value: "<YOUR HF TOKEN HERE>"
            # H200 NCCL topology file (verified present on Crusoe icat H200 nodes)
            - name: NCCL_TOPO_FILE
              value: /opt/nccl_topo/h100-80gb-sxm-ib-cloud-hypervisor.xml
            - name: LD_LIBRARY_PATH
              value: "/usr/local/cuda/lib64:/opt/hpcx/nccl_rdma_sharp_plugin/lib:/opt/hpcx/ucc/lib/ucc:/opt/hpcx/ucc/lib:/opt/hpcx/ucx/lib/ucx:/opt/hpcx/ucx/lib:/opt/hpcx/sharp/lib:/opt/hpcx/hcoll/lib:/opt/hpcx/ompi/lib:/usr/local/nvidia/lib"
            resources:
              limits:
                nvidia.com/gpu: "8"
                nvidia.com/hostdev: "8"
              requests:
                nvidia.com/gpu: "8"
                nvidia.com/hostdev: "8"
            volumeMounts:
            - name: config
              mountPath: /config
            - name: patch-script
              mountPath: /workspace/patch_21b.py
              subPath: patch_21b.py
            - name: outputs
              mountPath: /outputs
            - name: dshm
              mountPath: /dev/shm
            - name: nccl-topo
              mountPath: /opt/nccl_topo
            - name: infiniband
              mountPath: /dev/infiniband
          volumes:
          - name: config
            configMap:
              name: torchtitan-llama3-21b-config
          - name: patch-script
            configMap:
              name: torchtitan-llama3-21b-config
              items:
              - key: patch_21b.py
                path: patch_21b.py
          - name: outputs
            emptyDir: {}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: "20Gi"
          - name: nccl-topo
            hostPath:
              path: /etc/crusoe/nccl_topo
              type: Directory
          - name: infiniband
            hostPath:
              path: /dev/infiniband
              type: Directory
    Worker:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
          - name: pytorch
            image: ghcr.io/datadoc24/torchtitan-llama3-8b:latest
            imagePullPolicy: IfNotPresent
            securityContext:
              capabilities:
                add: ["IPC_LOCK"]
            workingDir: /workspace/torchtitan
            command:
            - /bin/bash
            - -c
            - |
              python3 /workspace/patch_21b.py
              torchrun \
                --nproc_per_node=8 \
                --nnodes=2 \
                --node_rank=${RANK} \
                --rdzv_endpoint=${MASTER_ADDR}:${MASTER_PORT} \
                --rdzv_backend=c10d \
                --rdzv_conf=timeout=1800 \
                -m torchtitan.train \
                --job.config_file /config/llama3_21B.toml
            env:
            - name: PYTORCH_ALLOC_CONF
              value: "expandable_segments:True"
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_IB_DISABLE
              value: "0"
            # H200: exclude mlx5_0 (admin/IPoIB), use the 8 remaining IB HCAs
            - name: NCCL_IB_HCA
              value: "^mlx5_0"
            # Aligned with Crusoe's known-working Slurm script (2 MB ring buffer)
            - name: NCCL_BUFFSIZE
              value: "2097152"
            # NOTE: NCCL_IB_GID_INDEX and NCCL_NET_GDR_LEVEL deliberately omitted —
            # the GID_INDEX=3 default in the template is for RoCE v2, not native IB.
            # The proven Crusoe Slurm config sets neither; we follow that.
            # HF token only needed for streaming-data variant (downloads c4 from Hugging Face).
            - name: HF_TOKEN
              value: "<YOUR HF TOKEN HERE>"
            # H200 NCCL topology file (verified present on Crusoe icat H200 nodes)
            - name: NCCL_TOPO_FILE
              value: /opt/nccl_topo/h100-80gb-sxm-ib-cloud-hypervisor.xml
            - name: LD_LIBRARY_PATH
              value: "/usr/local/cuda/lib64:/opt/hpcx/nccl_rdma_sharp_plugin/lib:/opt/hpcx/ucc/lib/ucc:/opt/hpcx/ucc/lib:/opt/hpcx/ucx/lib/ucx:/opt/hpcx/ucx/lib:/opt/hpcx/sharp/lib:/opt/hpcx/hcoll/lib:/opt/hpcx/ompi/lib:/usr/local/nvidia/lib"
            resources:
              limits:
                nvidia.com/gpu: "8"
                nvidia.com/hostdev: "8"
              requests:
                nvidia.com/gpu: "8"
                nvidia.com/hostdev: "8"
            volumeMounts:
            - name: config
              mountPath: /config
            - name: patch-script
              mountPath: /workspace/patch_21b.py
              subPath: patch_21b.py
            - name: outputs
              mountPath: /outputs
            - name: dshm
              mountPath: /dev/shm
            - name: nccl-topo
              mountPath: /opt/nccl_topo
            - name: infiniband
              mountPath: /dev/infiniband
          volumes:
          - name: config
            configMap:
              name: torchtitan-llama3-21b-config
          - name: patch-script
            configMap:
              name: torchtitan-llama3-21b-config
              items:
              - key: patch_21b.py
                path: patch_21b.py
          - name: nccl-topo
            hostPath:
              path: /etc/crusoe/nccl_topo
              type: Directory
          - name: infiniband
            hostPath:
              path: /dev/infiniband
              type: Directory
          - name: outputs
            emptyDir: {}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: "20Gi"
