# Cluster-egress overlay for CMK: each node builds a vxlan to the standalone
# Crusoe VPN gateway VM and routes the remote peer CIDRs through it. Pairs with
# cluster_egress in terraform/crusoe. See docs/crusoe-cluster-egress.md.
#
# Why an overlay: the Crusoe VPC fabric drops packets whose destination isn't
# the receiving VM, so a plain "route via gateway" can't transit. vxlan makes
# every node->gateway packet a real VM-to-VM frame, which the fabric delivers.
#
# Set the four values in the ConfigMap below, then:
#   kubectl apply -f k8s/cluster-egress/
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-egress-config
  namespace: kube-system
data:
  # Private (VPC) IP of the gateway VM — from `terraform -chdir=terraform/crusoe output crusoe_private_ips`.
  GATEWAY_LAN_IP: "REPLACE_GATEWAY_PRIVATE_IP"
  # Must match cluster_egress in terraform/crusoe.
  VXLAN_ID: "100"
  VXLAN_PORT: "4789"
  # Must be a /16 and match cluster_egress.overlay_cidr in terraform/crusoe.
  OVERLAY_CIDR: "169.254.0.0/16"
  # Space-separated remote peer CIDRs to route through the tunnel (the customer/cloud CIDRs).
  REMOTE_CIDRS: "10.200.0.0/16"
  # MSS to clamp overlay TCP SYNs to (match mss_clamp in terraform/crusoe).
  MSS_CLAMP: "1360"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cluster-egress
  namespace: kube-system
  labels:
    app: cluster-egress
spec:
  selector:
    matchLabels:
      app: cluster-egress
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: cluster-egress
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
      - operator: Exists
      terminationGracePeriodSeconds: 10
      containers:
      - name: overlay
        image: nicolaka/netshoot:latest
        securityContext:
          privileged: true
          capabilities:
            add: ["NET_ADMIN"]
        envFrom:
        - configMapRef:
            name: cluster-egress-config
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -uo pipefail
          WAN_IF=$(ip -o -4 route show default | awk '{print $5}' | head -1)
          # Deterministic, collision-free overlay IP within the /16: gateway is
          # <base>.0.1, each node is <base>.<3rd>.<4th octet of its node IP>.
          O3=$(echo "$NODE_IP" | cut -d. -f3); O4=$(echo "$NODE_IP" | cut -d. -f4)
          BASE=$(echo "$OVERLAY_CIDR" | cut -d. -f1-2)          # e.g. 169.254
          PREFIX=$(echo "$OVERLAY_CIDR" | cut -d/ -f2)          # 16
          GW_OVERLAY_IP="${BASE}.0.1"
          NODE_OVERLAY_IP="${BASE}.${O3}.${O4}"

          setup() {
            ip link del vxlan-ceg 2>/dev/null || true
            ip link add vxlan-ceg type vxlan id "$VXLAN_ID" local "$NODE_IP" \
              remote "$GATEWAY_LAN_IP" dstport "$VXLAN_PORT" dev "$WAN_IF"
            ip addr replace "${NODE_OVERLAY_IP}/${PREFIX}" dev vxlan-ceg
            ip link set vxlan-ceg mtu 1450 up
            for c in $REMOTE_CIDRS; do
              ip route replace "$c" via "$GW_OVERLAY_IP" dev vxlan-ceg
            done
            # Clamp overlay TCP SYNs (pod MTU is large; vxlan+ESP stack is small).
            iptables -t mangle -C FORWARD -o vxlan-ceg -p tcp --tcp-flags SYN,RST SYN \
              -j TCPMSS --set-mss "$MSS_CLAMP" 2>/dev/null || \
            iptables -t mangle -A FORWARD -o vxlan-ceg -p tcp --tcp-flags SYN,RST SYN \
              -j TCPMSS --set-mss "$MSS_CLAMP"
            echo "cluster-egress up on $(hostname): vxlan-ceg ${NODE_OVERLAY_IP}/${PREFIX} via ${WAN_IF}, routes [$REMOTE_CIDRS] via ${GW_OVERLAY_IP}"
          }
          setup
          # Re-assert if the interface disappears (e.g. after a network blip).
          while true; do
            if ! ip link show vxlan-ceg &>/dev/null; then
              echo "vxlan-ceg missing, re-creating"; setup
            fi
            sleep 30
          done
        lifecycle:
          preStop:
            exec:
              command: ["/bin/bash", "-c", "ip link del vxlan-ceg 2>/dev/null || true"]
