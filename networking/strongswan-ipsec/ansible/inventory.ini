# =============================================================================
# WHO to configure. The other file you edit is group_vars/all.yml (WHAT).
#
# Only Crusoe machines go here. Remote cloud VMs (Azure/GCP/AWS) need nothing
# installed - their cloud route tables already point at the VPN gateway.
# =============================================================================

# --- Your gateway VM(s) ---
# START WITH ONE. It holds one tunnel per address in vpn_remote_addrs, so an
# Azure active-active peer gives you two tunnels from this single VM - which
# is the most Azure allows one on-premises device.
#
# 8 vCPU is the right size. Each tunnel's inbound decrypt pins one core and
# cannot be spread, so a bigger instance does not go faster.
#
# Need more than ~4.6 Gbps through Azure? Add gateway VMs here - they are
# picked up automatically, no list to maintain. Azure then REQUIRES BGP; see
# group_vars/all.yml.
[vpn_gateways]
gw-1  ansible_host=<gateway-public-ip>
# gw-2  ansible_host=<gateway-2-public-ip>

# --- The Crusoe VMs that need to reach the remote subnet ---
# Every one of these must fall inside vpn_client_cidr.
# Using Kubernetes instead? Skip this group and deploy k8s/vpn-client.yaml.
[vpn_clients]
vm-1  ansible_host=<vm-1-ip>
# vm-2  ansible_host=<vm-2-ip>
# vm-3  ansible_host=<vm-3-ip>

# --- Connection defaults ---
[all:vars]
ansible_user=ubuntu
ansible_become=true
ansible_ssh_private_key_file=~/.ssh/<your-private-key>
ansible_ssh_common_args=-o StrictHostKeyChecking=no
