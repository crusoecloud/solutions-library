# Lightweight in-cluster Prometheus that scrapes the vLLM workload pods' :8000/metrics.
# Needed because CMK's vmagent only remote-writes to an external endpoint (no queryable local API).
#
# Consumers:
#   - KEDA (vllm:num_requests_waiting autoscaling signal — applied by `make install-vllm-hpa`)
#   - The grafana-cmk "Inference" dashboards (datasource points at svc prometheus-vllm:9090)
#
# Target detection (no namespace pinning — works cluster-wide):
#   1. KServe-managed pods: label kserve.io/component=workload (automatic on
#      LLMInferenceService workloads).
#   2. Any other vLLM pod: annotate it with BOTH prometheus.io/scrape: "true"
#      and prometheus.io/port: "8000" — e.g. the hand-rolled kimi-k3-atom
#      Deployment. Pod annotations are picked up live (a pod-restart is not
#      required), though the annotations belong in the pod template so new
#      pods carry them from birth.
#      The port match is deliberate: many infra images ship the generic
#      prometheus.io/scrape annotation; without the port filter they would
#      drown this job in permanently-down :8000 targets.
---
apiVersion: v1
kind: Namespace
metadata: { name: vllm-metrics }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus-vllm, namespace: vllm-metrics }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus-vllm }
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus-vllm }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-vllm }
subjects:
  - { kind: ServiceAccount, name: prometheus-vllm, namespace: vllm-metrics }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-vllm, namespace: vllm-metrics }
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      # Job 1 — KServe-managed vLLM pods (LLMInferenceService workloads in ANY
      # namespace): they carry kserve.io/component=workload automatically.
      # Excludes router-scheduler/EPP pods, which don't serve :8000/metrics.
      - job_name: vllm
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_kserve_io_component]
            regex: workload
            action: keep
          # scrape each pod's vLLM OpenAI/metrics port
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: $1:8000
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      # Job 2 — opt-in for non-KServe vLLM deployments (e.g. hand-rolled
      # Deployments): annotate the pod with BOTH:
      #   prometheus.io/scrape: "true"
      #   prometheus.io/port: "8000"
      # The port match is required to keep infra pods (cilium, cert-manager,
      # envoy gateway, ...) that carry the generic prometheus.io/scrape
      # annotation out of this vLLM-scoped job — they serve metrics on other
      # ports and would appear as permanently-down targets.
      - job_name: vllm-annotated
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: "8000"
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: $1:8000
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus-vllm, namespace: vllm-metrics, labels: { app: prometheus-vllm } }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus-vllm } }
  template:
    metadata: { labels: { app: prometheus-vllm } }
    spec:
      serviceAccountName: prometheus-vllm
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: prometheus-vllm }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus-vllm, namespace: vllm-metrics }
spec:
  selector: { app: prometheus-vllm }
  ports: [{ port: 9090, targetPort: 9090 }]
