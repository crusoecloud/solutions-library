apiVersion: v1
kind: Pod
metadata:
  name: spdk-nvmeof-test
  namespace: default
  labels:
    app: spdk-nvmeof-rdma
    test-type: storage-validation
spec:
  # IMPORTANT: Replace with your target MI355X node name
  # Get node names with: kubectl get nodes -l node.kubernetes.io/instance-type=a40.8x
  nodeName: YOUR-MI355X-NODE-NAME-HERE

  hostNetwork: true
  hostPID: true
  hostIPC: true

  containers:
  - name: spdk
    image: ubuntu:24.04
    command: ["sleep", "infinity"]

    securityContext:
      # WARNING: This pod runs with full root privileges
      # Only use in controlled test environments
      privileged: true
      capabilities:
        add:
        - SYS_MODULE     # Load kernel modules (vfio-pci)
        - SYS_RAWIO      # Raw device I/O via VFIO
        - SYS_ADMIN      # Administrative operations (mount, cgroup)
        - IPC_LOCK       # Lock memory for DMA
        - SYS_RESOURCE   # Override resource limits

    resources:
      limits:
        memory: 16Gi
      requests:
        memory: 16Gi

    volumeMounts:
    - name: hugepage
      mountPath: /dev/hugepages
    - name: cgroup
      mountPath: /sys/fs/cgroup
    - name: hostnvme
      mountPath: /hostnvme
      readOnly: true

  volumes:
  - name: hugepage
    hostPath:
      path: /dev/hugepages
      type: Directory
  - name: cgroup
    hostPath:
      path: /sys/fs/cgroup
      type: Directory
  - name: hostnvme
    hostPath:
      path: /mnt/nvme
      type: Directory

  restartPolicy: Never

  # Prevent accidental scheduling on production nodes
  tolerations: []
