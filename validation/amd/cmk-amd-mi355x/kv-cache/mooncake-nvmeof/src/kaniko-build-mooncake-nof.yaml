# Kaniko build pod for Mooncake NVMe-oF image
# Builds Dockerfile.mooncake-nof-mi355x with mooncake-ipv6-adrfam.patch
#
# Prerequisites:
#   kubectl create configmap mooncake-nof-build-context \
#     --from-file=Dockerfile=Dockerfile.mooncake-nof-mi355x \
#     --from-file=libionic-rdmav34.so --from-file=libionic.so.1 \
#     --from-file=ionic.driver
#
# Apply:
#   kubectl apply -f kaniko-build-mooncake-nof.yaml
#   kubectl logs -f kaniko-mooncake-nof -c kaniko
#
apiVersion: v1
kind: Pod
metadata:
  name: kaniko-mooncake-nof
  labels: { app: kaniko-build-mooncake-nof }
spec:
  restartPolicy: Never
  # No nodeName pin: the build pushes to a registry, so it can run on any
  # schedulable node. It does not need a GPU (the Dockerfile stubs
  # amdgpu-arch). Pin a node only if your registry is reachable from some
  # nodes and not others.
  tolerations: [ { operator: "Exists" } ]
  volumes:
    - { name: cm, configMap: { name: mooncake-nof-build-context } }
    - { name: context, emptyDir: {} }
    - name: docker-config
      secret:
        secretName: __PULL_SECRET__
        items: [ { key: .dockerconfigjson, path: config.json } ]
  initContainers:
    - name: prep-context
      image: mirror.gcr.io/library/busybox:1.36
      command: ["/bin/sh","-c"]
      args:
        - |
          set -eux
          cp -L /cm/Dockerfile /context/Dockerfile
          # ionic userspace RDMA provider — without these the image cannot
          # see the Pollara NICs and no NVMe-oF listener will come up
          cp -L /cm/libionic-rdmav34.so /cm/libionic.so.1 /cm/ionic.driver /context/
          test -s /context/libionic-rdmav34.so
          test -s /context/libionic.so.1
          echo "--- assembled build context ---"; ls -laR /context
      volumeMounts:
        - { name: cm, mountPath: /cm }
        - { name: context, mountPath: /context }
  containers:
    - name: kaniko
      # NOTE: :latest is a mutable tag and this pod holds registry push
      # credentials. Pin a released version or a digest before any
      # repeated or automated use.
      image: gcr.io/kaniko-project/executor:latest
      args:
        - --dockerfile=/context/Dockerfile
        - --context=dir:///context
        - --destination=__IMAGE__
        - --cache=true
        - --compressed-caching=false
        - --verbosity=info
      resources:
        requests: { cpu: "4", memory: 8Gi }
        limits:   { memory: 32Gi }
      volumeMounts:
        - { name: context, mountPath: /context }
        - { name: docker-config, mountPath: /kaniko/.docker }
