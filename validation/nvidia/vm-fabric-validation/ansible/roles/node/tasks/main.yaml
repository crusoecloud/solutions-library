- name: Mount NVMe RAID0 at /raid0 (per Crusoe ephemeral disk docs)
  ansible.builtin.include_role:
    name: raid0
  vars:
    raid0_mount_path: /raid0
  when:
    - use_raid0 | default(false) | bool
    - (ansible_local.nvme.nvme.count | int) > 0

- name: Create symbolic link for NVML library
  ansible.builtin.file:
    src: /usr/lib/{{ ansible_facts.architecture }}-linux-gnu/libnvidia-ml.so.1
    dest: /usr/lib/{{ ansible_facts.architecture }}-linux-gnu/libnvidia-ml.so
    state: link

- name: Hostfile for MPI
  block:
  - name: Create the validation folder
    ansible.builtin.file:
      path: "{{ validation_dir }}"
      state: directory
      owner: ubuntu
      group: ubuntu
      mode: '0755'

  - name: Copy the hostfile to each node
    ansible.builtin.copy:
      src: ../../../hostfile
      dest: "{{ validation_dir }}/hostfile"
      owner: ubuntu
      group: ubuntu
      mode: '0644'

- name: IMEX Support
  when:
    - use_imex | default(false) | bool
  block:
  - name: Copy the imex node file to each node
    ansible.builtin.copy:
      src: ../../../imex_nodes.txt
      dest: /etc/nvidia-imex/nodes_config.cfg
      owner: root
      group: root
      mode: '0644'
    notify: Restart nvidia-imex

  - name: Discover IMEX major number
    ansible.builtin.command: grep nvidia-caps-imex-channels /proc/devices
    register: imex_device
    changed_when: false

  - name: Create IMEX channel directory and node as root
    become: true
    block:
      - name: Ensure IMEX channel directory exists
        file:
          path: /dev/nvidia-caps-imex-channels
          state: directory
          mode: '0755'

      - name: Create channel0 device node
        command: mknod /dev/nvidia-caps-imex-channels/channel0 c {{ imex_device.stdout.split()[0] }} 0
        args:
          creates: /dev/nvidia-caps-imex-channels/channel0
        notify: Restart nvidia-imex

  # Restarts only through the handler: a restart on a running domain breaks IMEX jobs
  - name: Ensure nvidia-imex is started and enabled
    become: true
    ansible.builtin.systemd_service:
      name: nvidia-imex
      state: started
      enabled: true
