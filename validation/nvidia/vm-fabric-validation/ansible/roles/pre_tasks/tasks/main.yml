- name: Ensure required packages are installed
  ansible.builtin.apt:
    name:
      - nvme-cli
      - mdadm
    state: present
    update_cache: true
    cache_valid_time: 3600
    # A new VM's cloud-init or unattended-upgrades can hold the apt lock for a few minutes
    lock_timeout: 600

- name: Ensure custom facts directory exists
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    mode: '0755'

- name: Deploy custom NVMe fact script
  ansible.builtin.copy:
    src: nvme.fact  # Path to the script on your Ansible controller
    dest: /etc/ansible/facts.d/nvme.fact
    owner: root
    group: root
    mode: '0755'

- name: Re-gather facts to find the new custom fact
  ansible.builtin.setup:
