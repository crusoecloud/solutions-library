---
# Remote-side client VMs (Crusoe-to-Crusoe only)
#
# These VMs sit behind gw-rmt. The vpn_client role creates a GRE-over-FOU
# tunnel from each VM to the gateway specified by vpn_gateway_host.
# Skip this file if the remote side is Azure/GCP/AWS (no VM config needed).

# Which gateway to connect to
vpn_gateway_host: "gw-rmt"

# CIDRs to route through the GRE tunnel to the gateway.
# This should be the Crusoe source subnet — traffic to these IPs goes
# through the tunnel to reach the source side.
vpn_remote_subnet: "<source-private-subnet-cidr>"
