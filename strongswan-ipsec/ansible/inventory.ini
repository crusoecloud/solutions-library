# ===========================================================================
# VPN Inventory
#
# Gateways + Crusoe client VMs. Remote cloud VMs (Azure/GCP/AWS) are NOT
# listed — their cloud route tables handle routing automatically.
# ===========================================================================

# --- Gateways ---
[source_gateway]
gw-src  ansible_host=<gw-src-public-ip>

# Comment out if strongSwan is already set up on the remote end (e.g.,
# customer-managed Azure/GCP/AWS VPN gateway).
[remote_gateway]
gw-rmt  ansible_host=<gw-rmt-public-ip>

# --- Crusoe client VMs (source side) ---
[source_clients]
vm-s1  ansible_host=<vm-s1-public-ip>
# vm-s2  ansible_host=<vm-s2-public-ip>

# --- Crusoe client VMs (remote side, required if setting up Crusoe↔Crusoe VPN) ---
[remote_clients]
# vm-r1  ansible_host=<vm-r1-public-ip>
# vm-r2  ansible_host=<vm-r2-public-ip>

# --- Aggregate groups ---
[vpn_gateways:children]
source_gateway
remote_gateway

[vpn_clients:children]
source_clients
remote_clients

# --- Connection defaults ---
[all:vars]
ansible_user=ubuntu
ansible_become=true
ansible_ssh_private_key_file=~/.ssh/<your-private-key>