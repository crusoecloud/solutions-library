---
# Remote Gateway
#
# This is the VPN gateway on the remote side (datacenter, another Crusoe
# region, or a public cloud). It terminates IPsec from the source gateway.
#
# For non-Crusoe (Azure/GCP/AWS/datacenter): set vpn_use_gre=false
#   Traffic is forwarded directly onto the local network (IP forwarding).
# For Crusoe-to-Crusoe: set vpn_use_gre=true + vpn_client_cidr
#   GRE-over-FOU overlay to deliver traffic to local VMs.

# IKE identity for this gateway (local) and the remote peer
vpn_local_id: "gw-rmt@crusoe.vpn"
vpn_remote_id: "gw-src@crusoe.vpn"

# Public IP of the source gateway (IPsec peer)
vpn_remote_gw_ip: "<gw-src-public-ip>"

# IPsec traffic selectors — must mirror the source gateway.
# local = CIDRs on this side (0.0.0.0/0 = accept all traffic for full tunnel)
# remote = CIDRs on the source side (Crusoe subnets)
vpn_local_subnet: "0.0.0.0/0"
vpn_remote_subnet: "<source-private-subnet-cidr>"

# GRE-over-FOU overlay — set to true when this gateway is also on Crusoe.
# vpn_client_cidr: subnet of VMs behind this gateway
# For non-Crusoe: set vpn_use_gre=false (no vpn_client_cidr needed)
vpn_use_gre: false
# vpn_use_gre: true
# vpn_client_cidr: "<remote-private-subnet-cidr>"
