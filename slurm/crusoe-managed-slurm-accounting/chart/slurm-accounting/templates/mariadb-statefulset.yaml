{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "slurm-accounting.mariadb.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "slurm-accounting.labels" . | nindent 4 }}
    app.kubernetes.io/name: mariadb
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/instance: {{ include "slurm-accounting.mariadb.fullname" . }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "slurm-accounting.mariadb.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "slurm-accounting.labels" . | nindent 4 }}
    app.kubernetes.io/name: mariadb
spec:
  serviceName: {{ include "slurm-accounting.mariadb.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/instance: {{ include "slurm-accounting.mariadb.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/instance: {{ include "slurm-accounting.mariadb.fullname" . }}
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "slurm-accounting.mariadb.fullname" . }}
                  key: root-password
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.username }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "slurm-accounting.mariadb.fullname" . }}
                  key: password
          args:
            # Slurm's accounting queries rely on InnoDB's large buffer pool and
            # a lock wait timeout long enough to tolerate slurmdbd's bulk
            # commits under heavy job-completion bursts.
            - --innodb-buffer-pool-size=512M
            - --innodb-lock-wait-timeout=900
            - --innodb-log-file-size=256M
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 -u root -p"$MARIADB_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 -u root -p"$MARIADB_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.mariadb.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.mariadb.storageSize }}
{{- end }}
