{{- if .Values.remediationReport }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediationreports.remediation.crusoe.ai
  labels:
    {{- include "crusoe-node-remediation.labels" . | nindent 4 }}
spec:
  group: remediation.crusoe.ai
  names:
    plural: remediationreports
    singular: remediationreport
    kind: RemediationReport
    shortNames:
      - remreport
      - remrep
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Last Run
          type: string
          jsonPath: .status.lastRunTime
        - name: Status
          type: string
          jsonPath: .status.lastRunStatus
        - name: Total
          type: integer
          jsonPath: .status.pool.totalNodes
        - name: Ready
          type: integer
          jsonPath: .status.pool.readyNodes
        - name: Remediating
          type: integer
          jsonPath: .status.pool.remediatingNodes
        - name: Pending
          type: integer
          jsonPath: .status.pool.pendingRemediation
        - name: Cooldown
          type: integer
          jsonPath: .status.pool.cooldownNodes
        - name: Monitored
          type: integer
          jsonPath: .status.pool.monitoredNodes
        - name: Managed
          type: integer
          jsonPath: .status.pool.managedNodes
        - name: Unmanaged
          type: integer
          jsonPath: .status.pool.unmanagedNodes
        - name: OK
          type: integer
          jsonPath: .status.pool.okNodes
        - name: Due
          type: integer
          jsonPath: .status.pool.dueNodes
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status:
              type: object
              properties:
                lastRunTime:
                  type: string
                lastRunStatus:
                  type: string
                config:
                  type: object
                  properties:
                    cordonThreshold: { type: string }
                    remediationThreshold: { type: string }
                    remediationCooldown: { type: string }
                    actionType: { type: string }
                    dryRun: { type: boolean }
                    guardrailsGlobalMax: { type: integer }
                    guardrailsPerPoolMax: { type: integer }
                pool:
                  type: object
                  properties:
                    nodepoolId: { type: string }
                    totalNodes: { type: integer }
                    managedNodes: { type: integer }
                    readyNodes: { type: integer }
                    notReadyNodes: { type: integer }
                    remediatingNodes: { type: integer }
                    pendingRemediation: { type: integer }
                    cooldownNodes: { type: integer }
                    monitoredNodes: { type: integer }
                    unmanagedNodes: { type: integer }
                    okNodes: { type: integer }
                    dueNodes: { type: integer }
                    undeterminedNodes: { type: integer }
                    excludedNode: { type: string }
                    guardrailBlocked: { type: integer }
                cluster:
                  type: object
                  properties:
                    totalNodes: { type: integer }
                    unmanagedNodes: { type: integer }
                failures:
                  type: array
                  items:
                    type: object
                    properties:
                      node: { type: string }
                      error: { type: string }
                      attempts: { type: integer }
{{- end }}
